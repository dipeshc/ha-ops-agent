<title>Ops Agent</title>
<style nonce="{{NONCE}}">
:root,:root[data-theme="light"]{--bg:#f2f2f7;--card:#fff;--card-2:#f7f7fa;--fg:#1c1c1e;--muted:#6e6e73;--line:#e3e3e8;--primary:#0b6fb8;--on-primary:#fff;--warn:#8a5300;--warn-soft:#fff3df;--err:#b3261e;--err-soft:#fdecea;--ok:#1f6f2f;--ok-soft:#e7f4e8;--agent:#5b4bb8;--agent-soft:#efecfb;--me:#0b6fb8;color-scheme:light}

:root[data-theme="dark"]{--bg:#111113;--card:#1c1c1f;--card-2:#232327;--fg:#f2f2f7;--muted:#a2a2a8;--line:#2e2e33;--primary:#6cb8f2;--on-primary:#0a1a26;--warn:#ffb85c;--warn-soft:#33270f;--err:#ff8a80;--err-soft:#3a1c1c;--ok:#7fd08a;--ok-soft:#14301b;--agent:#b4a6f5;--agent-soft:#26223a;--me:#1b5f93;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;-webkit-text-size-adjust:100%}

.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15px;font-weight:600;line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

.row.quiet{min-height:44px;padding:8px 14px}
.row.quiet .t b{font-weight:400;font-size:14px;color:var(--muted)}
.calm{background:var(--card);border-radius:16px;box-shadow:0 0 0 1px var(--line);padding:24px 20px;margin-top:20px;display:flex;gap:16px;align-items:flex-start}
.calm .g{width:44px;height:44px;border-radius:12px;background:var(--ok-soft);color:var(--ok)}
.calm .g svg{width:24px;height:24px}

.strip b{color:var(--fg);font-weight:600}
.detail{background:var(--card);border-radius:16px;box-shadow:0 0 0 1px var(--line);padding:20px}
.kicker{font-size:13px;color:var(--muted)}
.detail h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:4px;line-height:1.25;overflow-wrap:anywhere}

.phases .done{color:var(--fg)}.phases .done::before{background:var(--ok)}
.phases .now{color:var(--primary);font-weight:600}.phases .now::before{background:var(--primary)}
.elapsed{font-size:12px;color:var(--muted);margin-top:4px}
.act{margin-top:16px;padding:16px;border-radius:12px;background:var(--card-2)}
.act>p{font-size:15px;line-height:1.45;max-width:60ch}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;font-size:15px;font-weight:600;color:var(--primary);background:color-mix(in srgb,var(--primary) 13%,transparent)}
.btn.fill{background:var(--primary);color:var(--on-primary)}
.btn.text{background:none;padding:0 10px;font-weight:500}
.btn.danger{color:var(--err);background:var(--err-soft)}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}
.facts{margin-top:16px}
.facts h3,.says h3,.tl h3{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.facts dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.says{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--agent-soft);border-left:3px solid var(--agent)}
.says h3{color:var(--agent);margin-bottom:4px}
.says h3 svg{width:14px;height:14px}
.says p{font-size:14px;max-width:60ch;margin:0 0 6px}
.says p:last-of-type{margin:0}
.src{font-size:12px;color:var(--muted);margin-top:6px}
.tl{margin-top:20px}
.tl ol{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:116px 1fr;gap:12px;padding:7px 0;font-size:14px;color:var(--muted);border-top:1px solid var(--line)}
.tl time{font-variant-numeric:tabular-nums;font-size:13px;padding-top:1px}
.tl li.now{color:var(--fg)}.tl li.now time{font-weight:600}
.who{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:6px;background:var(--card-2);margin-left:6px;vertical-align:1px;color:var(--muted)}
.who.you{background:var(--soft);color:var(--primary)}.who.agent{background:var(--agent-soft);color:var(--agent)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;font-size:12px;color:var(--muted);gap:12px;flex-wrap:wrap}
pre{font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--card-2);border-radius:10px;padding:10px 12px;margin:12px 0 0;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px}
.add{color:var(--ok)}.del{color:var(--err)}.ctxl{color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--card-2);border-radius:10px;padding:3px;margin:16px 0 0;box-shadow:0 0 0 1px var(--line)}
.seg button{padding:0 14px;min-height:34px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:15px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.kv>span:nth-child(2){color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.kv small{grid-column:1/-1;color:var(--muted);font-size:13px}
.kv.b{display:flex;flex-wrap:wrap;gap:8px}
.kv.b>.btn{flex:1 1 auto}
.sw{appearance:none;-webkit-appearance:none;margin:0;width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;cursor:pointer;flex:none;justify-self:end}
.sw:checked{background:var(--ok)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:left .15s}
.sw:checked::after{left:22px}
.sw[disabled]{opacity:.5}
.banner{background:var(--warn-soft);color:var(--warn);font-size:13px;padding:8px 12px;border-radius:12px;margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner .btn{min-height:32px}
.empty{padding:24px 16px;color:var(--muted);text-align:center;font-size:14px}
.log{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.chat{display:flex;flex-direction:column;gap:10px;padding:12px 0;max-width:720px}
.daysep{align-self:center;font-size:12px;color:var(--muted);padding:4px 10px}
.msg{max-width:82%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.msg p{margin:0 0 6px}.msg p:last-child{margin:0}
.msg ul{margin:4px 0 6px;padding-left:18px}.msg li{margin:2px 0}
.msg code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--card-2);padding:1px 4px;border-radius:4px}
.me{align-self:flex-end;background:var(--me);color:#fff;border-bottom-right-radius:6px;white-space:pre-wrap}
.me.sending{opacity:.7}
.ag{align-self:flex-start;background:var(--card);box-shadow:0 0 0 1px var(--line);border-bottom-left-radius:6px}
.tag{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--agent);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.tag svg{width:12px;height:12px}
.meta{font-size:11px;color:var(--muted);margin-top:-6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.meta.r{align-self:flex-end}.meta.l{align-self:flex-start}
.meta button{color:var(--muted);padding:0 6px;min-height:28px}
.fail{color:var(--err);font-size:12px;align-self:flex-end;min-height:28px}
.ctx{align-self:stretch;background:var(--soft);border-radius:12px;padding:8px 12px;font-size:13px;white-space:pre-wrap}
.ctx summary{cursor:pointer;min-height:32px;display:flex;align-items:center;color:var(--muted)}
.ccard{align-self:stretch;background:var(--card);border-radius:14px;box-shadow:0 0 0 1px var(--line);padding:14px;max-width:520px;font-size:14px}
.ccard.err{box-shadow:0 0 0 1px var(--err)}
.ccard.done{opacity:.7}
.ccard .k{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ccard.err .k{color:var(--err)}
.ccard .k svg{width:14px;height:14px}
.ccard p{margin-top:4px}
.ccard .btns{align-items:center}
.ccard .btn{min-height:38px;font-size:14px}
.auto{display:flex;gap:8px;align-items:center;font-size:13px;margin-left:auto}
.working{align-self:flex-start;display:flex;flex-direction:column;gap:4px;background:var(--card);box-shadow:0 0 0 1px var(--line);border-radius:18px;border-bottom-left-radius:6px;padding:10px 14px;min-width:220px;max-width:82%;font-size:14px}
.dots{display:flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
.lbl{display:flex;justify-content:space-between;gap:12px;font-weight:500}
.lbl time{color:var(--muted);font-variant-numeric:tabular-nums}
.steps{font-size:13px;color:var(--muted);margin:2px 0 0;padding:0;list-style:none}
.steps li::before{content:"\2713  ";color:var(--ok)}
.steps li.now{color:var(--primary);font-weight:600}.steps li.now::before{content:"\203A  "}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px 0 calc(10px + env(safe-area-inset-bottom));max-width:720px}
.composer textarea{flex:1;min-height:44px;max-height:160px;border-radius:22px;background:var(--card);border:0;box-shadow:0 0 0 1px var(--line);padding:10px 16px;font:inherit;font-size:15px;color:var(--fg);resize:none}
.send{width:44px;height:44px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
.send svg{width:20px;height:20px}
.send[disabled]{background:var(--line);color:var(--muted);cursor:default}
.count{font-size:11px;color:var(--muted)}.count.over{color:var(--err)}
.toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:#323232;color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:10}
.toast button{color:#7cc4f5;font-weight:600;min-height:36px}
.denied{padding:40px 20px;text-align:center;color:var(--muted)}
@media (max-width:839px){
.state small{flex-basis:100%;margin-left:18px}
.tl li{grid-template-columns:96px 1fr}
.act .btns .btn{flex:1 1 100%}
.row .t b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hdr h1{font-size:20px}
}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}.sw::after{transition:none}}
</style>

    h("div", { class: `state ${tone}` }, h("span", { class: "pip" }), h("span", { text: word(t) }), t.gist ? h("span", { class: "gist", text: `· ${t.gist}` }) : null,
      t.as_of ? h("small", { class: "tnum", text: `as of ${stamp(t.as_of, z, dayKey(t.as_of, z) !== today)}` }) : null),

    (t.facts || []).length ? h("div", { class: "facts" }, h("h3", { text: "What the daemon knows" }),
      h("dl", null, t.facts.map((x) => [h("dt", { text: x.label }), h("dd", { text: x.value, title: x.at ? `observed ${stamp(x.at, z, true)}` : null })]))) : null,
    t.agent ? says(t.agent) : null,

    h("div", { class: "foot" }, h("span", { text: t.footnote || "" }), btn("Ask about this", () => ask(`"${t.title}"`), "text")));

function phases(p) {

    run !== null && run > 0 ? h("div", { class: "elapsed tnum", text: `${Math.round(run / 60)} min elapsed${p.usual_s ? `, usually ${Math.round(p.usual_s / 60)} min` : ""}` }) : null];

/* The agent's words: always marked, sourced from the run's audit rows, never mixed with daemon facts. */

    (a.sources || []).length ? h("div", { class: "src", text: `Sources: ${a.sources.join(", ")}` }) : null,
    (a.not_read || []).length ? h("div", { class: "src", text: `Not read: ${a.not_read.join(", ")}` }) : null);
}
function timeline(evs) {

/* One paragraph, one filled button. Nothing is optimistic: the card changes when the daemon says so. */
function actBlock(t) {
  const n = t.need, extra = t.actions || [];
  const text = n ? n.text : t.about;
  if (!n && !text && !extra.length) return null;
  const all = [...(n && n.primary ? [{ ...n.primary, style: "fill" }] : []), ...(n ? n.secondary || [] : []), ...extra];

  return h("div", { class: "act" }, text ? h("p", { text }) : null, all.length ? h("div", { class: "btns" }, all.map(b)) : null);

els.tried = new Set();
setInterval(() => {
  const t = els.timer;
  if (t && t.el.isConnected) { const s = (Date.now() - t.started) / 1000; t.el.textContent = clock(s); if (s > 90 && s < 92) render(); }
  if (S.state && slots.hdr && freshState() !== els.freshSt) render();

/* A share in percent: never a misleading 0.0 for a small non-zero value; "est." when it includes estimates. */
function share(v, est, digits = 1) {
  const n = Number(v) || 0, floor = 10 ** -digits;
  const text = n === 0 ? "0%" : n < floor ? `<${floor}%` : `${n.toFixed(digits)}%`;
  return est ? `${text} est.` : text;
}
function fmtN(n) { return n == null ? "–" : n >= 1e6 ? `${(n / 1e6).toFixed(1)} M` : n >= 1e3 ? `${Math.round(n / 1e3)} k` : String(n); }

/* ---------------------------------------------------------------- chat: one conversation with the agent */
async function loadChat() {
  const r = await api("GET", "api/chat");
  if (r.status === 200) { S.main = r.data.thread; S.chatUnread = !!(r.data.info && r.data.info.unread); if (S.route === "chat") openThread(S.main); render(); }
}
async function openThread(id) {
  if (S.thread && S.thread !== id) leaveThread();
  S.thread = id; S.turns = []; S.info = null; S.inflight = null; els.scrollDown = true;
  render();
  await loadThread();
  startLive();
  presence(true);
}
function leaveThread() {
  if (!S.thread) return;
  presence(false);
  S.thread = null; S.turns = []; S.inflight = null;
  startLive();
}
async function loadThread(before) {
  const id = S.thread;
  const r = await api("GET", `api/threads/${id}${before ? `?before=${before}` : ""}`);
  if (id !== S.thread) return;
  if (r.status === 404) { leaveThread(); render(); return; }
  if (r.status !== 200) return;
  S.info = r.data.thread;
  S.turns = before ? [...r.data.turns, ...S.turns] : r.data.turns;
  S.more = r.data.more;
  S.inflight = r.data.in_flight;
  if (!before) els.scrollDown = true;
  render();
  markRead();
}
function markRead() {
  const last = S.turns.filter((t) => typeof t.id === "number").at(-1);
  if (last && S.thread && document.visibilityState === "visible") api("POST", `api/threads/${S.thread}/read`, { turn_id: last.id });
}
function upsertTurn(turn) {
  if (turn.thread !== S.thread) return;
  const i = S.turns.findIndex((t) => t.id === turn.id || (turn.client_id && t.client_id === turn.client_id));
  if (i >= 0) S.turns[i] = turn; else { S.turns.push(turn); S.turns.sort((a, b) => (a.id || 1e15) - (b.id || 1e15)); }
  if (turn.role !== "admin") announce(turn.role === "agent" ? `Agent: ${turn.text.slice(0, 200)}` : turn.text);
}

function toast(text, action, onAction) {
  clearTimeout(els.toastTimer);
  const close = () => { els.toast = null; render(); };
  els.toast = h("div", { class: "toast", role: "status" }, h("span", { text }),
    action ? h("button", { onclick: () => { clearTimeout(els.toastTimer); onAction(); close(); } }, action) : null);
  els.toastTimer = setTimeout(close, action ? 5000 : 3500);
  render();
}

/* ---------------------------------------------------------------- live updates */
let es = null, pollOn = false, pingTimer = null, presenceTimer = null, stateTimer = null, itemTimer = null;
const changed = new Set();
/* Item changes are batched (300 ms): Home, the open item and History refetch once. */
function itemChanged(id) {
  if (id) changed.add(id);
  clearTimeout(itemTimer);
  itemTimer = setTimeout(() => {
    loadHome();
    for (const x of changed) if (S.items[x]) loadItem(x);
    changed.clear();
    if (S.route === "history" || (S.route === "t" && S.from === "history")) loadHistory(S.hist ? S.hist.filter : "all");
  }, 300);
}
function beat() { S.fresh = Date.now(); if (S.offline) S.offline = false; if (slots.hdr && S.route) slots.hdr.replaceChildren(header()); }
function onEvent(kind, ev) {
  if (ev.seq) S.seq = Math.max(S.seq, ev.seq);
  const d = ev.data || {};
  if (kind === "turn") { upsertTurn(d); if (d.role !== "admin" && S.thread === d.thread) markRead(); render(); }
  else if (kind === "status" && ev.thread === S.thread) {
    const done = ["ok", "refused", "failed"].includes(d.state);
    S.inflight = done ? null : { ...(S.inflight || {}), ...d };
    if (done) els.lastLabel = "";
    render();
  } else if (kind === "thread") {
    if (d.id === S.main) S.chatUnread = !!d.unread && S.route !== "chat";
    if (d.id === S.thread) { S.info = d; d.unread = false; }
    render();
  } else if (kind === "item") {
    const cur = S.items[d.id];
    if (!cur || !(cur.revision >= d.revision)) itemChanged(d.id);
  } else if (["facts", "updates", "changes", "activity", "tasks"].includes(kind)) { itemChanged(null); if (S.route === "system") loadSystem(); }
  else if (kind === "state") { clearTimeout(stateTimer); stateTimer = setTimeout(loadState, 300); }
}
function resync() {
  loadState(); loadChat(); loadHome(); if (S.thread) loadThread(); if (S.route === "t") loadItem(S.arg); if (S.route === "system") loadSystem();
  if (S.route === "history") loadHistory(S.hist ? S.hist.filter : "all");
}
function stopLive() { if (es) { es.close(); es = null; } pollOn = false; clearTimeout(pingTimer); }
function startLive() {
  stopLive();
  if (document.visibilityState !== "visible") return;
  if (S.live === "poll" || typeof EventSource === "undefined") { poll(); return; }
  const url = `api/events${S.thread ? `?thread=${S.thread}` : ""}`;
  const src = new EventSource(url);
  es = src;
  let opened = false;
  const fallback = () => { if (es !== src) return; src.close(); es = null; S.live = "poll"; poll(); };
  const alive = () => { beat(); clearTimeout(pingTimer); pingTimer = setTimeout(fallback, 40000); };
  pingTimer = setTimeout(() => { if (!opened) fallback(); }, 5000);
  src.addEventListener("hello", () => { opened = true; alive(); });
  src.addEventListener("ping", alive);
  src.addEventListener("reset", () => { opened = true; alive(); resync(); });
  for (const k of ["turn", "status", "thread", "facts", "tasks", "state", "updates", "changes", "activity", "item"]) {
    src.addEventListener(k, (m) => { opened = true; alive(); try { onEvent(k, JSON.parse(m.data)); } catch (e) { /* ignore */ } });
  }
  src.onerror = () => { if (!opened) fallback(); else { S.offline = true; render(); } };
  src.onopen = () => { if (S.offline) { S.offline = false; resync(); } };
}
async function poll() {
  pollOn = true;
  const thread = S.thread;
  while (pollOn && thread === S.thread && document.visibilityState === "visible") {
    const r = await api("GET", `api/poll?after=${S.seq}${thread ? `&thread=${thread}` : ""}`);
    if (!pollOn || thread !== S.thread) return;
    if (r.status !== 200) { S.offline = true; render(); await new Promise((ok) => setTimeout(ok, 5000)); continue; }
    beat();
    if (r.data.reset) { S.seq = r.data.seq; resync(); continue; }

function presence(visible) {
  clearInterval(presenceTimer);

  if (!thread) return;
  api("POST", "api/presence", { thread, visible: visible && document.visibilityState === "visible" });
  if (visible) presenceTimer = setInterval(() => {
    if (S.thread === thread && document.visibilityState === "visible") api("POST", "api/presence", { thread, visible: true });
  }, LEASE_MS);
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { startLive(); resync(); presence(true); }
  else { presence(false); stopLive(); }

addEventListener("pagehide", () => presence(false));

/* HA theme colours, resolved to rgb() in HA's own document (its values may reference HA-only variables). The accent

const VARS = [["--primary", "--primary-color"], ["--bg", "--primary-background-color"], ["--card", "--card-background-color"],

function pick(got, dark) {
  const out = { ...got }, card = out["--card"] || (dark ? "rgb(28, 28, 28)" : "rgb(255, 255, 255)");

async function loadState() {

}
(async () => {
  theme();
  await loadState();
  if (!S.state) return;
  /* The old /updates path and #t=<chat> links land on Home and Chat. */
  if (/updates\/?$/.test(location.pathname) && !location.hash) setHash("#home");
  /* Push links open an item by path (/t/<item id>): ingress never forwards a #fragment. */
  const deep = location.pathname.match(/\/t\/([a-z]-[0-9a-z]{1,40})\/?$/);
